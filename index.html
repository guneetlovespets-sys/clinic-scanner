<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f456e">
<meta name="robots" content="noindex, nofollow">
<title>Clinic Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<!--
  Camera shell. The app and all data live in a Supertails-only Google Apps Script web app,
  embedded below; it runs as the signed-in staff member. This page only runs the live camera
  (Chrome allows it here, not inside Google's frame) and hands each decoded barcode to that app.
  It holds no data, no keys and no PIN.
-->
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#f4f6f9; font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif; color:#1b2430; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:#f4f6f9; z-index:5; }
  #gate .box { max-width:420px; width:100%; text-align:center; }
  #gate h2 { margin:0 0 6px; } .muted { color:#5d6b7a; font-size:14px; }
  .btn { display:block; width:100%; padding:14px; border-radius:10px; border:0; background:#1f456e; color:#fff; font-weight:600; font-size:16px; margin-top:12px; text-decoration:none; }
  .btn.alt { background:#fff; color:#1f456e; border:1.5px solid #1f456e; }
  .spin { width:34px; height:34px; border:4px solid #d5dde6; border-top-color:#1f456e; border-radius:50%; margin:0 auto 14px; animation:r 1s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  .hide { display:none !important; }
  #cam { position:fixed; inset:0; background:#000; z-index:20; display:none; flex-direction:column; }
  #cam.on { display:flex; }
  #cam video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .frame { position:absolute; left:8%; right:8%; top:34%; height:24%; border:3px solid rgba(255,255,255,.9); border-radius:12px; pointer-events:none; box-shadow:0 0 0 9999px rgba(0,0,0,.35); }
  .bar { padding:12px; padding-bottom:max(12px, env(safe-area-inset-bottom)); background:#111; display:flex; flex-direction:column; gap:8px; }
  .hint { color:#ddd; text-align:center; font-size:14px; min-height:20px; }
  .last { color:#fff; border-radius:10px; padding:8px 12px; font-weight:600; display:none; }
</style>
</head>
<body>
<iframe id="app" title="Clinic Scanner" allow="clipboard-write; fullscreen"></iframe>

<div id="gate">
  <div class="box">
    <div class="spin" id="spin"></div>
    <h2>Clinic Scanner</h2>
    <div class="muted" id="gateMsg">Opening with your Supertails Google account…</div>
    <div id="gateHelp" class="hide">
      <div class="muted" style="margin-top:10px">If this is the first time on this phone, sign in to your <b>Supertails</b> Google account in Chrome, then come back and tap Try again.</div>
      <a class="btn" id="signin" target="_blank" rel="noopener">Sign in / open the app once</a>
      <button class="btn alt" onclick="location.reload()">Try again</button>
    </div>
  </div>
</div>

<div id="cam">
  <div style="position:relative;flex:1"><video id="vid" playsinline muted></video><div class="frame"></div></div>
  <div class="bar">
    <div class="last" id="last"></div>
    <div class="hint" id="hint">Hold the barcode inside the box</div>
    <button class="btn alt" style="margin:0" onclick="document.getElementById('photo').click()">Take a photo instead</button>
    <input type="file" id="photo" accept="image/*" capture="environment" class="hide" onchange="decodePhoto(this)">
    <button class="btn" style="margin:0;background:#444" onclick="closeCam(true)">Done</button>
  </div>
</div>

<script>
const APP_URL = 'https://script.google.com/a/macros/supertails.com/s/AKfycbxSF5chaTtBtoMLSx8dW0NoKVtUF5hcW849uJFzKanUJ8QSvX5bVXPui_xMQVpJWlu9kQ/exec';
// Only Google's Apps Script sandbox may talk to this page.
const APP_ORIGIN_RE = /^https:\/\/n-[a-z0-9-]+-script\.googleusercontent\.com$/;
const $ = id => document.getElementById(id);
let appWin = null, appOrigin = null, multi = false, stream = null, detector = null, zx = null, last = '', lastAt = 0;

$('signin').href = APP_URL;
$('app').src = APP_URL;
const gateTimer = setTimeout(() => { $('spin').classList.add('hide'); $('gateMsg').textContent = 'Could not open the app.'; $('gateHelp').classList.remove('hide'); }, 12000);

function send(msg) { if (appWin && appOrigin) appWin.postMessage(msg, appOrigin); }
window.addEventListener('message', e => {
  if (!APP_ORIGIN_RE.test(e.origin) || !e.data || typeof e.data !== 'object') return;
  appWin = e.source; appOrigin = e.origin;
  const m = e.data;
  if (m.type === 'hello' || m.type === 'ready') { clearTimeout(gateTimer); $('gate').classList.add('hide'); }
  else if (m.type === 'scan') openCam(!!m.multi);
  else if (m.type === 'feedback') feedback(m.text, m.good);
  else if (m.type === 'close') closeCam(false);
});

/* ---- camera: BarcodeDetector (Chrome Android) → ZXing fallback → photo ---- */
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
async function getDetector() {
  if (detector) return detector;
  if ('BarcodeDetector' in window) {
    try { const sup = await BarcodeDetector.getSupportedFormats(); const f = FORMATS.filter(x => sup.includes(x));
          if (f.length) return (detector = new BarcodeDetector({ formats: f })); } catch (e) {}
  }
  if (!window.ZXing) await new Promise((res, rej) => { const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  zx = zx || new ZXing.BrowserMultiFormatReader(); return null;
}
function hit(code) {
  code = String(code || '').replace(/\s/g, ''); if (!code) return;
  const now = Date.now(); if (code === last && now - lastAt < 2000) return;
  last = code; lastAt = now; try { navigator.vibrate && navigator.vibrate(70); } catch (e) {}
  send({ type: 'code', code });
  if (!multi) closeCam(false);
}
function feedback(text, good) { const el = $('last'); el.textContent = text; el.style.display = 'block'; el.style.background = good ? 'rgba(29,122,70,.92)' : 'rgba(179,38,30,.92)'; }
async function openCam(isMulti) {
  multi = isMulti; last = ''; $('last').style.display = 'none';
  $('hint').textContent = multi ? 'Scan each item — every scan adds 1. Tap Done when finished.' : 'Hold the barcode inside the box';
  $('cam').classList.add('on');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    const vid = $('vid'); vid.srcObject = stream; await vid.play();
    const det = await getDetector();
    if (det) { const loop = async () => { if (!stream) return; try { const r = await det.detect(vid); if (r.length) hit(r[0].rawValue); } catch (e) {} if (stream) setTimeout(loop, 150); }; loop(); }
    else zx.decodeFromStream(stream, vid, res => { if (res) hit(res.getText()); });
  } catch (e) { $('hint').textContent = 'Camera blocked — allow camera access for this site, or use “Take a photo instead”.'; }
}
function closeCam(byUser) {
  $('cam').classList.remove('on');
  if (zx) try { zx.reset(); } catch (e) {}
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  if (byUser) send({ type: 'closed' });
}
async function decodePhoto(inp) {
  const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
  try {
    const det = await getDetector();
    if (det) { const r = await det.detect(await createImageBitmap(f)); if (r.length) return hit(r[0].rawValue); }
    else { const u = URL.createObjectURL(f); const r = await zx.decodeFromImageUrl(u); URL.revokeObjectURL(u); if (r) return hit(r.getText()); }
    feedback('No barcode found — fill the photo with the barcode, keep it flat and lit', false);
  } catch (e) { feedback('No barcode found in the photo — try again', false); }
}
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
